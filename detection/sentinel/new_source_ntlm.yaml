# Règle 1 du projet LANL : compte en NTLM depuis une machine source jamais vue.
#
# Un utilisateur travaille depuis un petit nombre de postes habituels ; un attaquant qui
# rejoue ses identifiants arrive depuis ses propres machines. NTLM est un indice, pas une preuve.
#
# Référence de 13 jours : Sentinel limite queryPeriod à 14 jours (13 jours de référence
# + 1 jour analysé). Logique rejouée en SQL sur les données de test LANL (notebook 07) :
# 35 journées compromises sur 47 (rappel 0,74) pour environ 315 couples (compte, jour)
# alertés par jour. Trop bruyante seule : à utiliser comme règle de chasse ou en
# corrélation avec la règle "machine partagée".
# Limites : si l'attaquant est déjà présent pendant la référence, ses machines n'y sont
# plus "nouvelles" ; les adresses DHCP qui changent créent de fausses nouveautés.
# Jamais exécutée sur un vrai espace Sentinel : à valider avant activation.
#
# Format : YAML du dépôt communautaire Azure-Sentinel. Pour un import par le portail
# (Analytics > Import), il faut un modèle ARM au format JSON.
id: a7c9debd-0533-49ac-bfa2-6182aa429c8a
name: Account using NTLM from a new source host
description: |
  Identifies a user account that authenticates with NTLM from a source IP it has not used in the previous 13 days. Attackers replaying stolen credentials connect from their own hosts rather than from the usual workstations of the victim.
severity: Low
status: InPreview
requiredDataConnectors:
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent
  - connectorId: WindowsSecurityEvents
    dataTypes:
      - SecurityEvent
queryFrequency: 1d
queryPeriod: 14d
triggerOperator: gt
triggerThreshold: 0
tactics:
  - LateralMovement
  - DefenseEvasion
relevantTechniques:
  - T1550.002
  - T1078
query: |
  let baseline_days = 13d;
  let logons = SecurityEvent
      | where TimeGenerated > ago(baseline_days + 1d)
      | where EventID == 4624
      | where LogonType in (3, 10)
      | where TargetUserName !endswith "$"
      | where TargetUserName !in~ ("ANONYMOUS LOGON", "SYSTEM", "LOCAL SERVICE", "NETWORK SERVICE")
      // domaine\compte : le compte local "Administrator" de chaque machine reste distinct
      // Adresse IP plutôt que WorkstationName, déclaré par le client en NTLM
      | extend Account = tolower(strcat(TargetDomainName, "\\", TargetUserName)),
               SourceIp = IpAddress,
               TargetHost = toupper(tostring(split(Computer, ".")[0]))
      // Une connexion d'une machine vers elle-même porte une adresse locale ou vide
      | where isnotempty(SourceIp) and SourceIp !in ("-", "::1", "127.0.0.1");
  // Adresses habituelles de chaque compte sur les 13 jours précédents
  let baseline = logons
      | where TimeGenerated <= ago(1d)
      | distinct Account, SourceIp;
  let today = logons
      | where TimeGenerated > ago(1d);
  let ntlm_accounts = today
      | where AuthenticationPackageName == "NTLM"
      | distinct Account;
  today
  | join kind=leftanti baseline on Account, SourceIp
  | join kind=inner ntlm_accounts on Account
  | summarize StartTime = min(TimeGenerated),
              EndTime = max(TimeGenerated),
              LogonCount = count(),
              TargetHosts = make_set(TargetHost, 50),
              DeclaredWorkstations = make_set(WorkstationName, 10),
              AccountSid = take_any(TargetUserSid),
              AccountName = take_any(TargetUserName),
              AccountDomain = take_any(TargetDomainName)
      by Account, SourceIp
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: AccountName
      - identifier: NTDomain
        columnName: AccountDomain
      - identifier: Sid
        columnName: AccountSid
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: SourceIp
version: 1.2.0
kind: Scheduled
