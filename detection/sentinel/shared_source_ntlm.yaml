# Règle 2 du projet LANL : compte en NTLM depuis une machine partagée par beaucoup de comptes.
#
# Un poste de travail sert normalement à une ou deux personnes. Un attaquant qui a volé
# des identifiants les rejoue souvent depuis une même machine compromise, qui devient
# anormalement partagée. NTLM est un indice compatible avec le pass-the-hash, pas une preuve.
#
# Logique rejouée en SQL sur les données de test LANL (notebook 07) : 38 journées
# compromises sur 47 (rappel 0,81) pour environ 206 couples (compte, jour) alertés par jour.
# Trop bruyante telle quelle : renseigner allowed_shared_sources avec les serveurs
# légitimement partagés (rebond, Citrix, RDS) et les adresses de NAT/VPN.
# Jamais exécutée sur un vrai espace Sentinel : à valider avant activation.
#
# Format : YAML du dépôt communautaire Azure-Sentinel. Pour un import par le portail
# (Analytics > Import), il faut un modèle ARM au format JSON.
id: 23a84255-fbd1-49be-accc-edfa0f23a240
name: Account using NTLM from a widely shared source host
description: |
  Identifies a user account that authenticates with NTLM from a source IP used by at least 10 distinct accounts on the same day. Stolen credentials are often replayed from a single compromised host, which becomes unusually shared.
severity: Medium
status: InPreview
requiredDataConnectors:
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent
  - connectorId: WindowsSecurityEvents
    dataTypes:
      - SecurityEvent
queryFrequency: 1d
queryPeriod: 1d
triggerOperator: gt
triggerThreshold: 0
tactics:
  - LateralMovement
  - DefenseEvasion
relevantTechniques:
  - T1550.002
  - T1021.002
  - T1078
query: |
  let min_accounts = 10;
  // Serveurs légitimement partagés (rebond, Citrix, RDS) et adresses de NAT/VPN
  let allowed_shared_sources = dynamic([]);
  // Connexions réussies (4624) et échouées (4625) : un attaquant qui essaie des
  // identifiants volés depuis la même machine la rend "partagée" même quand il échoue.
  // Types 3 (réseau) et 10 (bureau à distance) uniquement.
  let logons = SecurityEvent
      | where EventID in (4624, 4625)
      | where LogonType in (3, 10)
      | where TargetUserName !endswith "$"
      | where TargetUserName !in~ ("ANONYMOUS LOGON", "SYSTEM", "LOCAL SERVICE", "NETWORK SERVICE")
      // domaine\compte : le compte local "Administrator" de chaque machine reste distinct
      // Adresse IP plutôt que WorkstationName : en NTLM, le nom de poste est déclaré
      // par le client et peut être falsifié par un attaquant
      | extend Account = tolower(strcat(TargetDomainName, "\\", TargetUserName)),
               SourceIp = IpAddress,
               TargetHost = toupper(tostring(split(Computer, ".")[0]));
  // Connexions d'une machine vers une autre : une connexion d'une machine vers
  // elle-même porte une adresse locale ou vide, exclue ici
  let remote_logons = logons
      | where isnotempty(SourceIp) and SourceIp !in ("-", "::1", "127.0.0.1")
      | where SourceIp !in (allowed_shared_sources);
  let shared_sources = remote_logons
      | summarize AccountsOnSource = dcount(Account) by SourceIp
      | where AccountsOnSource >= min_accounts;
  // Comptes qui ont réussi au moins une connexion NTLM
  let ntlm_accounts = logons
      | where EventID == 4624 and AuthenticationPackageName == "NTLM"
      | distinct Account;
  remote_logons
  | join kind=inner shared_sources on SourceIp
  | join kind=inner ntlm_accounts on Account
  // Le SID est pris sur une connexion réussie : sur un échec (4625), il vaut souvent S-1-0-0
  | summarize StartTime = min(TimeGenerated),
              EndTime = max(TimeGenerated),
              LogonCount = count(),
              TargetHosts = make_set(TargetHost, 50),
              DeclaredWorkstations = make_set(WorkstationName, 10),
              AccountSid = take_anyif(TargetUserSid, EventID == 4624),
              AccountName = take_any(TargetUserName),
              AccountDomain = take_any(TargetDomainName)
      by Account, SourceIp, AccountsOnSource
  | order by AccountsOnSource desc
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: AccountName
      - identifier: NTDomain
        columnName: AccountDomain
      - identifier: Sid
        columnName: AccountSid
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: SourceIp
version: 1.2.0
kind: Scheduled
